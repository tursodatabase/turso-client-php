title: Turso PHP Extension
tagline: The native LibSQL client for PHP
description: >-
  Turso Client PHP is the native LibSQL database client for PHP — a Rust
  extension built with ext-php-rs, exposing open flags, fetch modes,
  prepared statements, transactions and offline writes through a single PHP
  class.
url: https://tursodatabase.github.io
baseurl: /turso-client-php

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: pretty

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - _site

defaults:
  - scope:
      path: "user-manual"
    values:
      layout: manual
