name: Update Release Metadata

on:
  workflow_dispatch:  # Allows the workflow to be run manually via the GitHub Actions interface
  workflow_run:       # Allows the workflow to trigger when another workflow completes
    workflows: ["Build and Publish PHP Extension"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-release:
    name: Update release metadata
    runs-on: ubuntu-24.04

    # Run the job only when triggered manually or when the triggering workflow completed successfully
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache Python Dependencies
        uses: actions/cache@v3
        id: cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch the Latest Release Data
        id: fetch_release
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          curl -f \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            -H "User-Agent: gh-actions-${{ github.workflow }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            -o $GITHUB_WORKSPACE/release_metadata.json

      - name: Upload Release Metadata Asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_metadata.py \
            --release-id "$(python -c "import json; print(json.load(open('$GITHUB_WORKSPACE/release_metadata.json'))['id'])")" \
            --actor ${{ github.actor }} \
            --file-path "$GITHUB_WORKSPACE/release_metadata.json"
