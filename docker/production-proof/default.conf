# nginx tier of the production proof: the public entrypoint.
#
# Plain upstream proxy to the php-fpm container (TCP :9000), with a php-file
# location so SCRIPT_FILENAME lands on the same path inside both containers.

server {
    listen 80 default_server;
    root /var/www;
    index index.php;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        fastcgi_pass app:9000;
        include fastcgi_params;
        # route everything through index.php like a replaced front controller.
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param FRONT_CONTROLLER 1;
        fastcgi_hide_header X-Powered-By;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"tier":"nginx"}';
    }
}
